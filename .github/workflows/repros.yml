# Runs every reproducer against several Linux x86_64 toolchains:
#   release   - the official Swift release image: the bug is expected to reproduce (the job fails, the run does not)
#   with fix  - Swift 6.4.2 with the proposed fixes applied: must pass (a directory's ci.json can override the image)
#   nightly   - the official nightly image of main (it can lag main by a few weeks): informational
# Weekly, to notice when the nightly toolchain picks up a fix. No artifacts are uploaded.
name: repros

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: repros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          # Every directory with a run.sh (top level and upstreamed/*) x every toolchain. A directory's optional
          # ci.json {"with_fix_image": "..."} replaces the image of the toolchain that is expected to pass.
          entries='[]'
          while IFS= read -r script; do
            dir="$(dirname "$script")"; dir="${dir#./}"
            fix=""
            [ -f "$dir/ci.json" ] && fix="$(jq -r '.with_fix_image // ""' "$dir/ci.json")"
            entries="$(jq -c --arg repro "$dir" --arg fix "$fix" --argjson acc "$entries" '
              $acc + [.[] | {repro: $repro, toolchain: .name, expect: .expect,
                             image: (if .expect == "pass" and $fix != "" then $fix else .image end)}]
            ' .github/toolchains.json)"
          done < <(find . -path ./.git -prune -o \( -path './*/run.sh' -o -path './upstreamed/*/run.sh' \) -type f -print | sort)
          echo "$entries" | jq .
          echo "matrix=$(jq -c '{include: .}' <<<"$entries")" >> "$GITHUB_OUTPUT"

  repro:
    needs: list
    name: ${{ matrix.repro }} · ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ matrix.expect != 'pass' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Run ${{ matrix.repro }}/run.sh
        shell: bash
        env:
          REPRO: ${{ matrix.repro }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          EXPECT: ${{ matrix.expect }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -o pipefail
          ./"$REPRO"/run.sh 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) result="toolchain behaves correctly" ;;
            1) result="bug reproduced" ;;
            *) result="setup problem (exit $rc)" ;;
          esac
          case "$EXPECT" in
            bug) note="expected: the bug reproduces on this toolchain" ;;
            pass) note="expected: the toolchain behaves correctly" ;;
            *) note="informational" ;;
          esac
          {
            echo "### $REPRO · $TOOLCHAIN"
            echo
            echo "Result: **$result** ($note). Image \`$IMAGE\`."
            echo
            echo '```'
            sed -n '1,80p' "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
