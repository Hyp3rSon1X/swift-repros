# Runs every reproducer against several Linux x86_64 toolchains:
#   release   - the official Swift release image: the bug is expected to reproduce (the job fails, the run does not)
#   with fix  - Swift 6.4.2 with the proposed fixes applied: must pass
#   nightly   - the official nightly image of main (it can lag main by a few weeks): informational
# Weekly, to notice when the nightly toolchain picks up a fix. No artifacts are uploaded.
name: repros

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: repros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    name: ${{ matrix.repro }} · ${{ matrix.toolchain.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ matrix.toolchain.expect != 'pass' }}
    strategy:
      fail-fast: false
      matrix:
        repro:
          - irgen-coercion-alloca-alignment
          - silgen-isolation-nonsending-overrelease
          - typed-throws-closure-generic-untyped
        toolchain:
          - name: swift 6.4.2 release
            image: swift:6.4.2-noble
            expect: bug
          - name: swift 6.4.2 with fix
            # Swift 6.4.2 plus backported fixes, including the ones proposed for these issues; see
            # https://github.com/Hyp3rSon1X/swift-toolchains/releases/tag/swift-6.4.2-hyp3r.7
            image: ghcr.io/hyp3rson1x/swift:6.4.2-hyp3r.7-noble@sha256:eca82664a750875021584e83a5a9bec0ad3b01951f333ab97c9d5a326bd8ba5d
            expect: pass
          - name: nightly main
            image: swiftlang/swift:nightly-main-noble
            expect: report
    container:
      image: ${{ matrix.toolchain.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Run ${{ matrix.repro }}/run.sh
        shell: bash
        env:
          REPRO: ${{ matrix.repro }}
          TOOLCHAIN: ${{ matrix.toolchain.name }}
          EXPECT: ${{ matrix.toolchain.expect }}
        run: |
          set -o pipefail
          ./"$REPRO"/run.sh 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) result="toolchain behaves correctly" ;;
            1) result="bug reproduced" ;;
            *) result="setup problem (exit $rc)" ;;
          esac
          case "$EXPECT" in
            bug) note="expected: the bug reproduces on this toolchain" ;;
            pass) note="expected: the toolchain behaves correctly" ;;
            *) note="informational" ;;
          esac
          {
            echo "### $REPRO · $TOOLCHAIN"
            echo
            echo "Result: **$result** ($note). Image \`${{ matrix.toolchain.image }}\`."
            echo
            echo '```'
            sed -n '1,80p' "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
